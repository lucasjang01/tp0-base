name: tp0
services:
  server:
    container_name: server
    image: server:latest
    entrypoint: python3 /main.py
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./server/config.ini:/config.ini
    networks:
      - testing_net
  client1:
    container_name: client1
    image: client:latest
    environment:
      - PYTHONUNBUFFERED=1
      - CLI_ID=1
      - CLI_LOG_LEVEL=DEBUG
      - CLI_BET_NOMBRE=Santiago Lionel
      - CLI_BET_APELLIDO=Lorca
      - CLI_BET_DOCUMENTO=30904465
      - CLI_BET_NACIMIENTO=1999-03-17
      - CLI_BET_NUMERO=7574
    networks:
      - testing_net
    depends_on:
      - server
  client2:
